# ── 6. Plugins & build ─────────────────────────────────────────────────
# Jekyll's own settings. You rarely need to touch anything below here.
permalink: pretty
excerpt_separator: <!-- more -->

# Per-tag pages at /tags/<slug>/, written by _plugins/tag_pages.rb across
# every collection. `false` turns them off; the tag links then fall back to
# the anchors on /tags/, which work either way.
tag_pages: true

plugins:
  - jekyll-sitemap
  - jekyll-mentions
  - jekyll-paginate-v2
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-commonmark
  - jekyll-include-cache
  - jemoji

# jekyll-paginate-v2 — paginates the blog listing at /blog/page/:num/
pagination:
  enabled: true
  collection: posts
  per_page: 2               # small on purpose, so the demo has pages to show
  permalink: "/page/:num/"
  sort_field: "date"
  sort_reverse: true
  # The window of numbers either side of the current page. jekyll-paginate-v2
  # builds `paginator.page_trail` from this, and _includes/pagination.html
  # renders it — every page is a real file, so the numbers work on GitHub
  # Pages with no JavaScript and no server.
  trail:
    before: 2
    after: 2

jekyll-mentions: https://twitter.com

twitter:
  username: imswarnil

social:                              # jekyll-seo-tag's structured data
  name: Swarnil Singhai
  links:
    - https://twitter.com/imswarnil
    - https://www.linkedin.com/in/imswarnil
    - https://github.com/imswarnil
    - https://youtube.com/@ImSwarnil

favicons:                            # size: path
  16:   "/assets/logos/logo@16px.png"
  32:   "/assets/logos/logo@32px.png"
  96:   "/assets/logos/logo@96px.png"
  120:  "/assets/logos/logo@120px.png"
  144:  "/assets/logos/logo@144px.png"
  180:  "/assets/logos/logo@180px.png"
  512:  "/assets/logos/logo@512px.png"
  1024: "/assets/logos/logo@1024px.png"

# NOTE on caching: the theme's own CSS and JS carry `?v=<build time>` in
# the templates that load them. A deploy that changes a script therefore
# changes its URL, instead of leaving a returning reader on the old file
# until their cache expires. Nothing to configure — Liquid does not run in
# this file, so the stamp lives where it is used.

css_inline: false                    # true = inline all CSS into <head>

sass:
  quiet_deps: true

# Not published. NOTE: CNAME must NOT be listed — Jekyll copies it into
# _site so the GitHub Pages deploy keeps the custom domain.
exclude:
  - README.md
  - ROADMAP.md
  - CLAUDE.md
  - DESIGN.md
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - LICENSE
  - screenshot.png
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - node_modules
  - .jekyll-cache
  - bin
  - tools
  - vendor
  - docs/decisions
  - design/README.md
  - docs/nextjs-rebuild-prompt.md
  - "*.gemspec"
