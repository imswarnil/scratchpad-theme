# ── Guestbook ──────────────────────────────────────────────────────────
# A static site has no server, so the guestbook is the comments provider
# you already configured (see `comments:`), pointed at one page.
guestbook:
  intro: "Say hello, leave a note, tell me what you are building. No account needed if you are signing by email."

  # ── The theme's own manual ──────────────────────────────────────────
  # A collection, so the docs are pages with a nav rather than one very
  # long page. `section:` groups them in the rail and `order:` sorts them.
  docs:
    output: true
    title: Docs
    singular: Page
    description: "How to use this theme — set it up, fill it, style it, ship it."
    permalink: /docs/:name/
    landing: /docs/
    icon: book-open
    schema: TechArticle
    style: compact
    card: doc
    hero: false
    image: "/assets/img/covers/docs.svg"
    single:
      shell: course
      lead: none
      parts: [head, toc-mobile, prose, docsnav-prevnext]
      widgets: [toc]
      sidebar: false

# The last-resort cover, when an entry has none and its collection has none.
# Scratchpad draws a cover from the entry's own front matter before falling
# back this far — see _includes/utility/thumb.html.
placeholder_image: "/assets/img/placeholder.svg"

defaults:
  - scope:
      path: ""
    values:
      image: "/assets/img/placeholder.svg"
      layout: post                        # every collection entry → post
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page                        # standalone pages → page
  # A lesson is inside a course, not inside a site menu: it drops the site
  # header and carries its own bar instead — which course, how far through,
  # and the way back. See _includes/single/coursebar.html.
  - scope:
      path: ""
      type: "lessons"
    values:
      chrome: false

