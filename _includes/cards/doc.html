{%- assign it = include.item -%}
<article class="sp-doccard">
  <a class="sp-doccard-link" href="{{ it.url | relative_url }}">
    <span class="sp-doccard-icon" aria-hidden="true"><i class="ph-bold ph-{{ it.icon | default: 'file-text' }}"></i></span>
    <span class="sp-doccard-body">
      <span class="sp-doccard-title">{{ it.title }}</span>
      {%- if it.description %}<span class="sp-doccard-text">{{ it.description }}</span>{% endif -%}
    </span>
    <i class="ph-bold ph-arrow-right sp-doccard-go" aria-hidden="true"></i>
  </a>
</article>
