{%- assign it = include.item -%}
<article class="sp-lessonrow">
  <a class="sp-lessonrow-link" href="{{ it.url | relative_url }}">
    <span class="sp-lessonrow-n">{{ it.lesson | default: forloop.index }}</span>
    <span class="sp-lessonrow-body">
      <span class="sp-lessonrow-title">{{ it.title }}</span>
      {%- assign snip = it.description | default: it.excerpt -%}
      {%- if snip and snip != "" %}<span class="sp-lessonrow-text">{{ snip | strip_html | truncate: 100 }}</span>{% endif -%}
    </span>
    {%- if it.minutes %}<span class="sp-lessonrow-time">{{ it.minutes }} min</span>{% endif -%}
  </a>
</article>
