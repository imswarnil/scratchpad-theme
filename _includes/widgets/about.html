<section class="sp-widget sp-widget-author">
  <img class="sp-widget-avatar" src="{{ site.avatarurl | relative_url }}" alt="" width="44" height="44">
  <h2 class="sp-widget-title">{{ site.author | default: site.title }}</h2>
  <p class="sp-widget-text">{{ site.description | strip_html | truncate: 130 }}</p>
  {% include social-row.html %}
  <a class="sp-btn sp-btn-sm sp-btn-outline sp-w-full" href="{{ '/about/' | relative_url }}">About me</a>
</section>
