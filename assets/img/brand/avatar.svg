<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Portrait placeholder">
  <!-- A placeholder portrait, so the theme ships with no photograph of a
       real person in it. Replace `avatarurl` in _config.yml with your own
       and nothing here is used. -->
