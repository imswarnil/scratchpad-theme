<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Portrait placeholder">
  <!-- The hero's portrait slot, as a drawing rather than a photograph:
       the theme ships without a picture of anybody. Point `hero_image` at
       your own and this is never rendered. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141417"/><stop offset="1" stop-color="#26262c"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="18%" r="72%">
      <stop offset="0" stop-color="#f22f46" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#f22f46" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#fff" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="640" height="640" rx="40" fill="url(#bg)"/>
  <rect width="640" height="640" rx="40" fill="url(#dots)"/>
  <rect width="640" height="640" rx="40" fill="url(#glow)"/>
  <circle cx="320" cy="256" r="88" fill="#fff" fill-opacity="0.14"/>
  <path d="M140 556a180 180 0 0 1 360 0Z" fill="#fff" fill-opacity="0.1"/>
  <circle cx="320" cy="256" r="22" fill="#f22f46"/>
</svg>
