<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280" role="img" aria-label="Flat log → final, in ten seconds">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(180 26% 12%)"/><stop offset="1" stop-color="hsl(180 39% 22%)"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="14%" r="70%">
      <stop offset="0" stop-color="hsl(180 79% 52% / 0.38)"/><stop offset="1" stop-color="hsl(180 79% 52% / 0.38)" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.7" fill="hsl(180 35% 75% / 0.16)"/></pattern>
  </defs>
  <rect width="720" height="1280" fill="url(#bg)"/>
  <rect width="720" height="1280" fill="url(#p)"/>
  <rect width="720" height="1280" fill="url(#glow)"/>
  <g transform="translate(240 520) scale(10)" fill="none" stroke="#fff" stroke-opacity="0.85"
     stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" color="#fff">
    <rect x="2" y="4" width="20" height="16" rx="3"/><path d="M10 9l5 3-5 3V9Z" fill="currentColor" stroke="none"/>
  </g>
</svg>
