<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="The collections and their colours">
  <style>
    .t { font-family: Geist, ui-sans-serif, system-ui, sans-serif; }
    .n { font-size: 13px; font-weight: 500; fill: #e5e5e5; }
    .c { font-size: 11px; fill: #8a8a92; }
    .lbl { font-size: 12px; fill: #8a8a92; letter-spacing: 1.4px; }
  </style>
  <rect width="960" height="300" rx="16" fill="#0e0e11"/>
  <text class="t lbl" x="40" y="42">ONE ACCENT, ONE HUE PER COLLECTION</text>
  <g>
    <!-- hue rotations of #f22f46, matching tokens/_tokens.scss -->
    <g transform="translate(40 66)"><rect width="128" height="58" rx="10" fill="#f22f46"/><text class="t n" y="86">Blog</text><text class="t c" y="104">posts</text></g>
