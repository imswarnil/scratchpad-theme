    <g transform="translate(328 66)"><rect width="128" height="58" rx="10" fill="#d97b2f"/><text class="t n" y="86">Web series</text><text class="t c" y="104">−65°</text></g>
    <g transform="translate(472 66)"><rect width="128" height="58" rx="10" fill="#b99a2f"/><text class="t n" y="86">Courses</text><text class="t c" y="104">−90°</text></g>
    <g transform="translate(616 66)"><rect width="128" height="58" rx="10" fill="#6fae3f"/><text class="t n" y="86">Snippets</text><text class="t c" y="104">−115°</text></g>
    <g transform="translate(760 66)"><rect width="128" height="58" rx="10" fill="#2fb27a"/><text class="t n" y="86">Portfolio</text><text class="t c" y="104">−140°</text></g>

    <g transform="translate(40 186)"><rect width="128" height="58" rx="10" fill="#2fb0b2"/><text class="t n" y="86">Travel</text><text class="t c" y="104">−160°</text></g>
    <g transform="translate(184 186)"><rect width="128" height="58" rx="10" fill="#2f8ef2"/><text class="t n" y="86">Prompts</text><text class="t c" y="104">−180°</text></g>
    <g transform="translate(328 186)"><rect width="128" height="58" rx="10" fill="#5a5ef2"/><text class="t n" y="86">Uses</text><text class="t c" y="104">−220°</text></g>
    <g transform="translate(472 186)"><rect width="128" height="58" rx="10" fill="#9a3ff2"/><text class="t n" y="86">Newsletter</text><text class="t c" y="104">−250°</text></g>
    <g transform="translate(616 186)"><rect width="128" height="58" rx="10" fill="#e23fd0"/><text class="t n" y="86">Podcast</text><text class="t c" y="104">−290°</text></g>
